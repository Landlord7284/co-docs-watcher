# co-docs-watcher — the configuration the container reads.
#
#   cp docker/config.example.toml docker/config.toml
#
# compose.yaml mounts this file read-only at /config/config.toml and the image points
# $CO_WATCHER_CONFIG at it. It is a file of its own, separate from the config.toml a hand-run
# uses, because the roots differ: inside the container they are the three mount points, and a
# relative root would resolve against /config — the directory of the file naming it — rather
# than against anything mounted.
#
# Only the keys that differ from a host installation are spelled out here. Every key, with
# its default and the reasoning behind it, is in config.example.toml at the repository root;
# this file may carry any of them.

[paths]
# The mount points, absolute. What each one holds, and which host directory it comes from,
# is decided in compose.yaml and .env.
data_root = "/data"
documents_root = "/documents"
logs_root = "/logs"

[retention]
days = 7

[discovery]
# Swept by `run` — the daily sweep, fired by SWEEP_SCHEDULE.
days = 7
# Swept by `run --monitor` — the frequent profile, fired by MONITOR_SCHEDULE. Frequency is
# not coverage: however often a 2-day window is swept, it observes today and yesterday, and
# nothing else. The daily sweep is what sees the rest.
monitor_days = 2

[files]
# The archive leaves the container through a share, so its modes are declared rather than
# inherited. Ownership is the other half of that answer, and it is PUID/PGID in .env.
directory_mode = 0o755
file_mode = 0o644

[source]
# The application is immune to the host zone — this is what anchors every date it writes.
# TZ in .env is a different setting, for the scheduler, and both need to be right.
timezone = "America/Sao_Paulo"
min_request_interval = 15.0
max_requests_per_run = 200
