name: ci

on:
  push:
  pull_request:
  # docker-publish runs this before it publishes anything.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The image is built here because it cannot fail quietly anywhere else: a Dockerfile
      # that stopped building, or a pinned scheduler whose digest no longer matches what the
      # release serves, would only be discovered by the next deployment.
      - run: docker build --tag co-docs-watcher:ci .
      # Any argument other than `scheduler` is the CLI itself, reached through the privilege
      # drop and the TZ derivation the entrypoint performs before anything else runs. The
      # configuration is mounted because that derivation reads it: a container without one
      # refuses to start, and the smoke test has to exercise the shape a deployment uses.
      - run: |
          docker run --rm \
            --volume "${PWD}/config.example.toml:/watcher/config.toml:ro" \
            co-docs-watcher:ci --version
